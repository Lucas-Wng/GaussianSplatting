name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # macOS: build-only. GitHub's hosted macOS runners are VMs behind a paravirtualized GPU
  # ("AppleParavirtDevice"), not real Metal hardware passthrough, and MoltenVK crashes
  # against it during physical-device init (NSInvalidArgumentException from
  # newArgumentEncoderWithLayout:, confirmed in practice) -- that's an environment
  # limitation of the runner, not something fixable here. Still valuable: it catches
  # compile/portability issues against a real Apple toolchain and SDK headers (this is how
  # a latent C++20-parenthesized-aggregate-init incompatibility with macos-14's stock Xcode
  # was actually found). The real GPU correctness check runs on Linux below, via lavapipe.
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest

      - name: Install dependencies
        run: brew install glfw glm vulkan-headers vulkan-loader molten-vk

      - name: Install slangc
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/slang
          # Anchored to match exactly one asset -- an unanchored pattern like
          # '*macos-aarch64*.zip' also matches the '-debug-info' build, and unzip chokes
          # when the glob below expands to more than one archive path.
          gh release download --repo shader-slang/slang --pattern '*-macos-aarch64.zip' --dir /tmp/slang --clobber
          mkdir -p /tmp/slang-extracted
          archive="$(ls /tmp/slang/*.zip | head -n1)"
          unzip -q "$archive" -d /tmp/slang-extracted
          echo "$(dirname "$(find /tmp/slang-extracted -name slangc | head -1)")" >> "$GITHUB_PATH"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglfw3-dev libglm-dev mesa-vulkan-drivers vulkan-tools xvfb unzip wget

          # Ubuntu's own libvulkan-dev is too old to satisfy CMakeLists.txt's
          # find_package(Vulkan 1.4 REQUIRED); pull a current Vulkan SDK from LunarG's
          # apt repo instead (mesa-vulkan-drivers above still provides the lavapipe ICD).
          codename="$(lsb_release -cs)"
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/lunarg.gpg > /dev/null
          sudo wget -qO "/etc/apt/sources.list.d/lunarg-vulkan-${codename}.list" "https://packages.lunarg.com/vulkan/lunarg-vulkan-${codename}.list"
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk

      - name: Install slangc
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/slang
          # Anchored to match exactly one asset -- an unanchored pattern like
          # '*linux-x86_64*.tar.gz' also matches '-debug-info'/'-glibc-2.27'/'-glibc-2.28'
          # builds, and tar chokes when the glob below expands to more than one archive path.
          gh release download --repo shader-slang/slang --pattern '*-linux-x86_64.tar.gz' --dir /tmp/slang --clobber
          mkdir -p /tmp/slang-extracted
          archive="$(ls /tmp/slang/*.tar.gz | head -n1)"
          tar -xzf "$archive" -C /tmp/slang-extracted
          echo "$(dirname "$(find /tmp/slang-extracted -name slangc | head -1)")" >> "$GITHUB_PATH"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Show available Vulkan ICDs (debugging aid)
        run: |
          ls -la /usr/share/vulkan/icd.d/ 2>&1 || true
          xvfb-run -a vulkaninfo --summary 2>&1 || true

      - name: Run radix self-test (lavapipe, under a virtual display)
        working-directory: build
        # No VK_ICD_FILENAMES override: setting it to a guessed path once caused
        # ErrorIncompatibleDriver (it disables the loader's normal ICD auto-discovery
        # entirely, so a wrong guess finds zero ICDs instead of falling back). Let the
        # loader find whatever mesa-vulkan-drivers installed on its own.
        run: xvfb-run -a ctest --output-on-failure
